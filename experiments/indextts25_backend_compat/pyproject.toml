[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indextts25-backend-compat"
version = "0.1.0"
description = "Experimental IndexTTS 2.5/vLLM-Omni compatibility backend"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
indextts25-smoke = "indextts25_compat.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
test = []
webui = ["gradio>=5.0,<7", "psutil>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/indextts25_compat"]
